name: Gerar Bomberman

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bomberman.yml"

permissions:
  contents: write

concurrency:
  group: bomberman
  cancel-in-progress: false

jobs:
  generate:
    name: Gerar e salvar animacao
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gerar Bomberman com minhas contribuicoes
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: lhbenlolo-dev
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: bomberman

      - name: Salvar imagens na branch bomberman-output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: bomberman-output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
